name: Deploy worksheets (apu2.com)

on:
  workflow_dispatch:
    inputs:
      db_all:
        description: "DB: send every unit (not only changed ones)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - "site/**"
      - "content/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-worksheets
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 変わった単元を git diff で探すため

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 問題データをチェック（エラーがあればここで止まる）
        run: python3 tools/check.py

      # アップロード（上書き）のみ。--delete を付けないので、サーバー上のファイルは1つも削除しない。
      # 送るのは site/worksheets/ の中身だけ。/aplus/worksheets/ の外や inc/secret.php は触らない。
      - name: ロリポップへ FTP アップロード（/aplus/worksheets/ へ上書きのみ・削除なし）
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -q lftp >/dev/null
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Secret $v is empty"; exit 1; fi
          done
          lftp -c "debug 3; set ftp:ssl-allow true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30;
                   open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
                   mirror -R --no-perms --parallel=4 --verbose=1 ./site/worksheets/ /aplus/worksheets/"

      - name: 受け口の接続確認
        run: |
          echo "page GET: $(curl -s -o /dev/null -w '%{http_code}' https://www.apu2.com/worksheets/us/math/grade-3/)"
          echo "sync GET: $(curl -s -w ' [%{http_code}]' https://www.apu2.com/worksheets/api/sync.php | head -c 200)"
          U=https://www.apu2.com/worksheets/api/sync.php
          python3 -c "import json,gzip,base64;print(base64.b64encode(gzip.compress(open('content/catalog.json','rb').read())).decode())" > /tmp/cat.b64
          python3 -c "import gzip,base64;print(base64.b64encode(gzip.compress(open('content/us/math/grade-3/area.json','rb').read())).decode())" > /tmp/unit.b64
          echo "probe UA: $(curl -s -o /dev/null -w '%{http_code}' -X POST -A 'aplus-worksheets-sync/1' --data 'test' $U)"
          echo "probe hdr: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-WS-Time: 1' -H 'X-WS-Sig: abc' --data 'test' $U)"
          echo "probe cat: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: text/plain' --data-binary @/tmp/cat.b64 $U)"
          echo "probe unit: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: text/plain' --data-binary @/tmp/unit.b64 $U)"
          echo "probe octet: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/octet-stream' --data-binary @/tmp/cat.b64 $U)"
          echo "sync POST: $(curl -s -X POST -H 'Content-Type: text/plain' --data 'test' -w ' [%{http_code}]' https://www.apu2.com/worksheets/api/sync.php | head -c 200)"

      - name: DB を更新（変わった単元だけ）
        env:
          WS_SYNC_KEY: ${{ secrets.WS_SYNC_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.db_all }}" = "true" ]; then
            python3 tools/sync_db.py --all
          elif [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/sync_db.py --since "${{ github.event.before }}"
          else
            python3 tools/sync_db.py --since HEAD~1
          fi
