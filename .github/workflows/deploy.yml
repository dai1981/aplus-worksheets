name: Deploy worksheets (apu2.com)

on:
  workflow_dispatch:
    inputs:
      db_all:
        description: "DB: send every unit (not only changed ones)"
        type: boolean
        default: false
      jd_all:
        description: "Japanese dictionary: send every word and every /japanese/ file"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - "site/**"
      - "content/**"
      - "jdict/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-worksheets
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 変わった単元を git diff で探すため

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 問題データをチェック（エラーがあればここで止まる）
        run: python3 tools/check.py

      # アップロード（上書き）のみ。--delete を付けないので、サーバー上のファイルは1つも削除しない。
      # 送るのは site/worksheets/ の中身だけ。/aplus/worksheets/ の外や inc/secret.php は触らない。
      - name: ロリポップへ FTP アップロード（/aplus/worksheets/ へ上書きのみ・削除なし）
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -q lftp >/dev/null
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Secret $v is empty"; exit 1; fi
          done
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30;
                   open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
                   mirror -R --no-perms --parallel=4 --verbose=1 ./site/worksheets/ /aplus/worksheets/"

      # データは FTP で inc/queue/sync.json.gz に上書き → api/sync.php が取り込む（WAF を通さない）
      - name: DB を更新（変わった単元だけ・ws_ テーブルのみ）
        env:
          WS_SYNC_KEY:  ${{ secrets.WS_SYNC_KEY }}
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.db_all }}" = "true" ]; then
            python3 tools/sync_db.py --all
          elif [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/sync_db.py --since "${{ github.event.before }}"
          else
            python3 tools/sync_db.py --since HEAD~1
          fi

      # 日本語辞書の型枠・一覧ページ（site/japanese/ → /aplus/japanese/）。変わったファイルだけを put（上書きのみ・削除なし）。
      # /aplus/japanese/ には単語の .html が十数万あるので、フォルダ全体を比べる mirror は使わない。
      - name: 日本語辞書のファイルを FTP アップロード（変わったものだけ・削除なし）
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.jd_all }}" = "true" ]; then
            git ls-files site/japanese > /tmp/jd_files.txt
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -q '^0*$'; then
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" HEAD -- site/japanese > /tmp/jd_files.txt
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- site/japanese > /tmp/jd_files.txt
          fi
          if [ ! -s /tmp/jd_files.txt ]; then echo "no /japanese/ files changed"; exit 0; fi
          python3 - <<'PY' > /tmp/jd.lftp
          import json, os
          print("set ftp:ssl-allow true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30;")
          print("open -u %s,%s %s" % (json.dumps(os.environ["FTP_USERNAME"]), json.dumps(os.environ["FTP_PASSWORD"]), json.dumps(os.environ["FTP_SERVER"])))
          for f in open("/tmp/jd_files.txt").read().split():
              d = "/aplus/" + os.path.dirname(f)[len("site/"):]
              print("mkdir -p -f %s" % json.dumps(d))
              print("put %s -o %s" % (json.dumps(f), json.dumps(d + "/" + os.path.basename(f))))
          PY
          echo "files: $(wc -l < /tmp/jd_files.txt)"
          lftp -f /tmp/jd.lftp
          rm -f /tmp/jd.lftp

      - name: 日本語辞書の DB を更新（jd_word テーブルのみ・変わった語だけ）
        env:
          WS_SYNC_KEY:  ${{ secrets.WS_SYNC_KEY }}
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.jd_all }}" = "true" ]; then
            python3 tools/sync_jd.py --all
          elif [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/sync_jd.py --since "${{ github.event.before }}"
          else
            python3 tools/sync_jd.py --since HEAD~1
          fi
